 return `<section class="hero"><div class="bx"><div style="display:flex;align-items:center;gap:14px;margin-bottom:12px"><div class="av2">${av(me,40)}</div><label class="c" style="cursor:pointer;display:inline-flex;gap:6px;align-items:center">${I('camera',15)} ${t('photo')}<input type="file" accept="image/*" hidden onchange="setPhoto(this)"></label></div>
 ${editing?`<p style="color:var(--mut);font-size:13px">${t('editNote')}</p><input id="fn" value="${esc(me.name)}"><input id="fa" value="${esc(me.age)}"><input id="fs" type="tel" value="${esc(me.phone)}"><input id="fp" type="tel" value="${esc(me.parent)}"><input id="fw" type="password" autocomplete="new-password" placeholder="${t('newPass')}"><button class="b" onclick="subReq()">${t('submitReq')}</button><button class="b s" onclick="editing=false;render()">${t('cancel')}</button>`:rows+(rq?`<p class="wt">${t('reqPend')}</p>`:`<button class="b s" onclick="editing=true;render()">${I('edit',15)} ${t('editInfo')}</button>`)}</div>${card()}</section>
 <div class="bx"><h4>${t('bought')}</h4>${my.map(p=>`<div class="rw"><span>${esc(p.title)} — ${p.amount} ${t('egp')}</span><span class="${p.s==='a'?'ok':p.s==='p'?'wt':'no'}">${p.s==='a'?t('active'):p.s==='p'?t('pend'):t('rej')}</span></div>`).join('')||t('none')}</div>`}
function setPhoto(i){const f=i.files[0];if(f)shrink(f,300,d=>{me.photo=d;save();render()})}
function subReq(){const ch={},n=cl($('#fn').value),a=nd(cl($('#fa').value)),s=nd(cl($('#fs').value)),p=nd(cl($('#fp').value)),w=cl($('#fw').value);
 if(n&&n!==me.name)ch.name=n;if(a&&a!==String(me.age))ch.age=a;if(s&&s!==me.phone)ch.phone=s;if(p&&p!==me.parent)ch.parent=p;if(w){if(w.length<6)return alert(t('e3'));ch.pass=w}
 if(!Object.keys(ch).length)return alert(t('noChg'));
 db.reqs.push({id:Date.now(),email:me.email,name:me.name,ch,ts:Date.now(),s:'p'});save();editing=false;render();alert(t('reqSent'))}
/* teacher dashboard */
function vDash(){const cnt={pay:db.payments.filter(p=>p.s==='p').length,ed:db.reqs.filter(r=>r.s==='p').length,msg:unread()};
 const tabs=[['pay','tPay'],['ed','tEd'],['crs','cs'],['stu','tStu'],['msg','tMsg'],['set','tSet']];
 return `<div class="ch">${tabs.map(([k,l])=>`<button class="c ${dt===k?'on':''}" onclick="dt='${k}';render()">${t(l)}${cnt[k]?` (${cnt[k]})`:''}</button>`).join('')}</div>`+({pay:dPay,ed:dEd,crs:dCrs,stu:dStu,msg:dMsg,set:dSet}[dt])()}
function dPay(){return `<p style="color:var(--mut);font-size:13px">${t('verify')}</p>`+([...db.payments].reverse().map(p=>`<div class="bx"><div class="pay">${p.img?`<img class="th" src="${p.img}" alt="" onclick="zoom(${p.id})">`:''}<div style="flex:1;min-width:150px"><b>${esc(p.name)}</b><div style="color:var(--mut);font-size:13px">${esc(p.phone||'')}</div><div>${esc(p.title)} — ${p.amount} ${t('egp')}</div><small style="color:var(--mut)">${t(p.m)} · ${fd(p.ts)}</small></div>
 <div style="min-width:120px">${p.s==='p'?`<button class="b" onclick="setP(${p.id},'a')">${I('check',15)} ${t('ap')}</button><button class="b s no" onclick="setP(${p.id},'r')">${t('rj')}</button>`:`<span class="${p.s==='a'?'ok':'no'}">${t(p.s==='a'?'active':'rej')}</span>${p.s==='a'?`<button class="b s" onclick="setP(${p.id},'r')">${t('rvk')}</button>`:''}`}</div></div></div>`).join('')||`<p>${t('none')}</p>`)}
function zoom(id){const p=db.payments.find(x=>x.id===id);showM(`<img src="${p.img}" style="width:100%;border-radius:12px" alt=""><button class="b s" onclick="closeM()">${t('close')}</button>`)}
function setP(id,s){db.payments.find(x=>x.id===id).s=s;save();render()}
function dEd(){const lb={name:'name',age:'age',phone:'sp',parent:'pp',pass:'pass'};
 return db.reqs.filter(r=>r.s==='p').reverse().map(r=>{const u=db.users.find(x=>x.email===r.email)||{};return `<div class="bx"><b>${esc(r.name)}</b> <small style="color:var(--mut)">${fd(r.ts)}</small>${Object.entries(r.ch).map(([k,v])=>`<div class="rw"><span>${t(lb[k])}</span><span>${k==='pass'?'••••••':`${esc(u[k]??'')} → <b>${esc(v)}</b>`}</span></div>`).join('')}<div style="display:flex;gap:8px"><button class="b" onclick="setR(${r.id},'a')">${t('ap')}</button><button class="b s no" onclick="setR(${r.id},'r')">${t('rj')}</button></div></div>`}).join('')||`<p>${t('none')}</p>`}
function setR(id,s){const r=db.reqs.find(x=>x.id===id);r.s=s;if(s==='a'){const u=db.users.find(x=>x.email===r.email);if(u)Object.assign(u,r.ch)}save();render()}
function dCrs(){const o=a=>a.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
 return `<div class="bx"><h4>${t('newC')}</h4><input id="ct" placeholder="${t('ct')}"><textarea id="cd" rows="3" placeholder="${t('cDesc')}"></textarea><select id="cg">${o([0,1,2].map(i=>[i,t('g'+i)]))}</select><select id="cr">${o(TR.map(x=>[x[0],x[0]]))}</select><input id="cp" type="number" min="0" placeholder="${t('price')}"><small style="color:var(--mut)">${t('cImg')}</small><input id="cf" type="file" accept="image/*"><button class="b" onclick="addC()">${t('publish')}</button></div>
 <div class="bx"><h4>${t('addItem')}</h4><select id="ic">${o(db.courses.map(c=>[c.id,esc(c.title)]))}</select><select id="it">${o([['video',t('video')],['exam',t('exam')],['pdf',t('pdf')]])}</select><input id="ii" placeholder="${t('itemTitle')}"><input id="iu" dir="ltr" placeholder="${t('itemUrl')}"><button class="b" onclick="addI()">${t('publish')}</button></div>
 <div class="bx">${db.courses.map(c=>`<div class="rw"><span>${esc(c.title)} <small style="color:var(--mut)">(${c.items.length})</small></span><span><button class="c" onclick="openC(${c.id})">${t('open')}</button> <button class="c no" onclick="delC(${c.id})">${t('del')}</button></span></div>`).join('')}</div>`}
function addC(){const ti=cl($('#ct').value);if(!ti)return alert(t('ct'));const c={id:Date.now(),title:ti,desc:cl($('#cd').value),g:+$('#cg').value,tr:$('#cr').value,price:+$('#cp').value||0,items:[]},f=$('#cf').files[0],fin=()=>{db.courses.push(c);save();render()};f?shrink(f,700,d=>{c.img=d;fin()}):fin()}
function addI(){const ic=$('#ic');if(!ic)return;const c=db.courses.find(x=>x.id==ic.value),ti=cl($('#ii').value),u=cl($('#iu').value);if(!c||!ti||!/^https?:\/\//.test(u))return alert(t('badurl'));c.items.push({id:Date.now(),type:$('#it').value,title:ti,url:u});save();render()}
function delI(cid,iid){const c=db.courses.find(x=>x.id===cid);c.items=c.items.filter(i=>i.id!==iid);save();render()}
function delC(id){if(confirm('?')){db.courses=db.courses.filter(c=>c.id!==id);save();render()}}
function dStu(){return db.users.map((u,i)=>`<div class="bx"><div style="display:flex;gap:12px;align-items:center"><div class="av2">${av(u,26)}</div><div><b>${esc(u.name)}</b><div style="color:var(--mut);font-size:13px">${t('g'+u.g)} · ${esc(u.age)} · ${esc(u.email)}</div><div style="font-size:13px">${t('sp')}: ${esc(u.phone)} | ${t('pp')}: ${esc(u.parent)}</div></div></div>
 <div style="display:flex;gap:8px;margin-top:8px"><select id="gs${i}" style="margin:0;flex:1">${db.courses.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select><button class="c" onclick="grant(${i})">${t('grant')}</button></div></div>`).join('')||`<p>${t('none')}</p>`}
function grant(i){const u=db.users[i],s=$('#gs'+i),c=s&&db.courses.find(x=>x.id==s.value);if(!c)return;db.payments.push({id:Date.now(),email:u.email,name:u.name,phone:u.phone,cid:c.id,title:c.title,amount:c.price,m:'manual',ts:Date.now(),s:'a'});save();render()}
function dMsg(){return thr().map((a,i)=>`<div class="bx"><b>${esc(a[0].name)}</b> <small style="color:var(--mut)">${used(a[0].email)}/3</small><div class="chat sm">${a.map(m=>`<div class="bub ${m.from==='t'?'me':''}"><small>${m.from==='t'?t('teacher'):esc(m.name)} · ${fd(m.ts)}</small>${esc(m.text).replace(/\n/g,'<br>')}</div>`).join('')}</div><div class="rowin"><textarea id="rp${i}" rows="2" placeholder="${t('msgP')}"></textarea><button class="b" style="width:auto" onclick="reply(${i})">${I('send',16)}</button></div></div>`).join('')||`<p>${t('none')}</p>`}
function reply(i){const a=thr()[i],x=cl($('#rp'+i).value);if(!x)return;db.msgs.push({id:Date.now(),email:a[0].email,name:a[0].name,from:'t',text:x,ts:Date.now()});save();render()}
function dSet(){return `<div class="bx"><h4>${t('wal')}</h4><small>${t('wn')}</small><input id="w" dir="ltr" value="${esc(db.wallet)}"><small>${t('in')}</small><input id="i" dir="ltr" value="${esc(db.insta)}"><small>${t('aiUrl')}</small><input id="ai" dir="ltr" placeholder="https://your-worker.workers.dev" value="${esc(db.ai||'')}"><button class="b" onclick="db.wallet=cl($('#w').value);db.insta=cl($('#i').value);db.ai=cl($('#ai').value);save();this.textContent='OK'">${t('save')}</button></div>`}
/* pay */
function openPay(id){pz=db.courses.find(c=>c.id===id);pmth='vc';drawPay();$('#ov').style.display='flex'}
function drawPay(){$('#md').innerHTML=`<h3 style="margin-top:0">${t('pay')}: ${esc(pz.title)}</h3><div class="pr">${pz.price} ${t('egp')}</div>
 <div class="pm">${['vc','ip'].map(m=>`<button class="${pmth===m?'on':''}" onclick="pmth='${m}';drawPay()">${t(m)}</button>`).join('')}</div><small>${t('send')}</small><div class="nm">${esc(pmth==='vc'?db.wallet:db.insta)}</div>
 <small>${t('proof')}</small><input type="file" id="pf" accept="image/*"><button class="b" onclick="sendPay()">${t('conf')}</button><button class="b s" onclick="closeM()">${t('cancel')}</button>`}
function sendPay(){const f=$('#pf').files[0];if(!f)return alert(t('pfirst'));shrink(f,900,d=>{db.payments.push({id:Date.now(),email:me.email,name:me.name,phone:me.phone,cid:pz.id,title:pz.title,amount:pz.price,m:pmth,img:d,ts:Date.now(),s:'p'});save();closeM();render();alert(t('sent'))})}
/* support */
function openSup(){const m='ghhbvvbnt@gmail.com';showM(`<h3 style="margin-top:0">${t('supT')}</h3><p style="color:var(--mut)">${t('supS')}</p><div class="nm">${m}</div><button class="b" onclick="cpy('${m}',this)">${I('copy',16)} ${t('copy')}</button><a class="b s" href="https://mail.google.com/mail/?view=cm&fs=1&to=${m}" target="_blank" rel="noopener">${I('mail',16)} ${t('gmail')}</a><a class="b s" href="mailto:${m}">${t('mailapp')}</a><button class="b s" onclick="closeM()">${t('close')}</button>`)}
function cpy(x,b){const d=()=>{b.textContent=t('copied')};function fb(){const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();d()}
 try{navigator.clipboard.writeText(x).then(d,fb)}catch(e){fb()}}
render();
</script></body></html>
